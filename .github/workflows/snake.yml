name: Generate Snake

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: output        # IMPORTANT: work only in output branch

      - name: Generate snake animation
        uses: Platane/snk@v3
        with:
          github_user_name: yvishi
          outputs: |
            dist/github-contribution-grid-snake.svg
            dist/github-contribution-grid-snake-dark.svg

      - name: Commit and push only to output branch
        uses: EndBug/add-and-commit@v9
        with:
          message: "Update snake animation"
          add: "dist/*"
